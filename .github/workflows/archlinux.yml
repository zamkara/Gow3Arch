name: Native Arch Linux release

on:
  schedule:
    - cron: '43 20 * * *' # Daily at 03:43 Asia/Jakarta.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archlinux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      build_required: ${{ steps.source.outputs.build_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - name: Fetch and merge upstream source with fork policy protected
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash packaging/arch/sync-upstream.sh
          git push origin HEAD:main
      - name: Select exact source for every subsequent job
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          required=true
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] && gh release view "arch-$commit" --json isDraft --jq '.isDraft' | grep -qx false; then
            required=false
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build_required=$required" >> "$GITHUB_OUTPUT"

  validate:
    needs: sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.commit }}
      - name: Check native packaging and installer regressions
        run: |
          for script in build.sh packaging/arch/PKGBUILD packaging/arch/gow3 packaging/arch/*.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s tests -p 'test_arch_packaging.py' -v
          python3 -m unittest discover -s tests -p 'test_gpu_user_paths.py' -v
          python3 -m unittest discover -s tests -p 'test_overlay_cadence.py' -v

  build:
    needs: [sync, validate]
    if: needs.sync.outputs.build_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.commit }}
      - name: Build and test with Arch makepkg
        env:
          SOURCE_COMMIT: ${{ needs.sync.outputs.commit }}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          mkdir -p dist
          docker run --rm -e GOW3_COMMIT="$SOURCE_COMMIT" \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --mount "type=bind,src=$PWD/dist,dst=/output" \
            archlinux:base-devel bash /repo/packaging/arch/ci-build.sh
          cp packaging/arch/install.sh dist/install.sh
          cd dist
          sha256sum *.pkg.tar.zst PKGBUILD SRCINFO install.sh > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gow3-arch-x86_64
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: [sync, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.sync.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gow3-arch-x86_64
          path: dist
      - name: Verify and open the native package on clean Arch
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          docker run --rm \
            --mount "type=bind,src=$PWD,dst=/repo,readonly" \
            --mount "type=bind,src=$PWD/dist,dst=/release,readonly" \
            archlinux:base bash /repo/packaging/arch/smoke-test.sh

  publish:
    needs: [sync, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gow3-arch-x86_64
          path: dist
      - name: Publish verified native Arch release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.sync.outputs.commit }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tag="arch-$SOURCE_COMMIT"
          cat > notes.md <<'NOTES'
          Native x86_64 Arch Linux package, also suitable for Omarchy.

          Install or update with the same command:

          ```bash
          curl -fsSL https://github.com/zamkara/Gow3Arch/releases/latest/download/install.sh | bash
          ```

          The installer verifies the package checksum and skips an already current version. Pacman manages dependencies and removal. Requires an AVX-capable CPU, a Vulkan 1.3 driver and your own game dump. No game data is included. Headless launcher checks do not establish gameplay compatibility.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$SOURCE_COMMIT" --title "Gow3Arch ${SOURCE_COMMIT:0:12}" --notes-file notes.md
          fi
          gh release upload "$tag" ./*.pkg.tar.zst PKGBUILD SRCINFO install.sh SHA256SUMS --clobber
          gh release edit "$tag" --draft=false --prerelease=false --latest
